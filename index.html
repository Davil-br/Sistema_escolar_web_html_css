<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Sistema Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Sistema de Gerenciamento Escolar</h1>

    <div class="entrar">
    <h2 id="entrar">Entrar no sistema</h2>
    <form>
        <label>Colaborador:</label><br>
        <input type="text" placeholder="Nome do colaborador" name="usuario"/><br><br>

        <label>Matricula:</label><br>
        <input type="number" placeholder="Número de Matricula" name="Matricula"/><br><br>

        <label>Senha:</label><br>
        <input type="password" placeholder="Digite sua senha" name="senha"/><br><br>

        <input class="botao" type="submit" value="Entrar"/>
    </form>
    </div>

    <hr>

    <div class="cadastro">
    <h2 id="cadastro">Cadastro de Aluno</h2>
    
    <form>
        <label>Nome do Aluno:</label><br>
        <input type="text" placeholder="Digite seu nome" name="nomeAluno"/><br><br>

        <label>Matricula:</label><br>
        <input type="number" placeholder="Número de Matricula" name="Matricula"/><br><br>

        <label>Data de Nascimento:</label><br>
        <input type="date" name="dataNascimento"/><br><br>

        <label>Série:</label><br>
        <input type="text" placeholder="Série Escolar" name="serie"/><br><br>

        <input  class="botao" type="submit" value="Salvar"/>
    </form>
    </div>

    <hr>

    <div class="lista">
    <h2 id="lista">Lista de Alunos</h2>
    <table border="1">
        <tr>
            <th>Nome</th>
            <th>Série</th>
            <th>Ações</th>
        </tr>
        <tr>
            <td>Maria Silva</td>
            <td>8º Ano</td>
            <td><button class="botao">Editar</button> <button class="botao">Excluir</button></td>
        </tr>
        <tr>
            <td>João Souza</td>
            <td>9º Ano</td>
            <td><button class="botao">Editar</button class="botao"> <button class="botao">Excluir</button></td>
        </tr>
        <tr>
            <td>Ana Paula</td>
            <td>7º Ano</td>
            <td><button class="botao">Editar</button> <button class="botao">Excluir</button></td>
        </tr>
    </table>
    </div>
</body>
</html>
